<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sala de Segurança{% endblock %}</title>
<style>
  :root { --navy:#1F3864; --blue:#2F5496; --light:#D9E2F3; --grey:#595959; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f6fa; color: #222; }
  nav { background: var(--navy); color: #fff; display: flex; gap: 18px; align-items: center; padding: 12px 24px; flex-wrap: wrap; }
  nav b { font-size: 18px; margin-right: 12px; }
  nav a { color: #fff; text-decoration: none; opacity: .85; }
  nav a:hover { opacity: 1; text-decoration: underline; }
  nav .sp { flex: 1; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  h1 { color: var(--navy); margin-top: 0; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th { background: var(--navy); color: #fff; text-align: left; padding: 10px; font-size: 14px; }
  td { padding: 9px 10px; border-bottom: 1px solid #e3e6ee; font-size: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .btn { background: var(--blue); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
  .btn.sec { background: #8a93a6; } .btn.red { background: #C62828; }
  input[type=text], input[type=password], input[type=date], select { padding: 8px; border: 1px solid #bbb; border-radius: 6px; width: 100%; font-size: 14px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--grey); }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; } .check label { margin: 0; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  .msg.ok { background: #E3F4E4; color: #1B5E20; } .msg.erro { background: #FDE7E7; color: #B71C1C; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; color: #fff; white-space: nowrap; }
  .t-ENTRADA { background: #2E7D32; } .t-SAIDA { background: #2F5496; }
  .t-ACESSO_NEGADO { background: #E69500; } .t-TENTATIVA_INVASAO { background: #C62828; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .row > div { flex: 1; min-width: 150px; }
  .muted { color: var(--grey); font-size: 13px; }
</style>
</head>
<body>
{% if session.user %}
<nav>
  <b>Sala de Segurança</b>
  <a href="{{ url_for('monitoramento') }}">Monitoramento</a>
  <a href="{{ url_for('colaboradores') }}">Colaboradores</a>
  <a href="{{ url_for('logs') }}">Logs</a>
  <a href="{{ url_for('exportar_csv') }}">Exportar CSV</a>
  <span class="sp"></span>
  <span class="muted" style="color:#cfd8ee">{{ session.user }}</span>
  <a href="{{ url_for('logout') }}">Sair</a>
</nav>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
